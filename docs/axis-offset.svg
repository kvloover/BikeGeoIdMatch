<text x="26" y="36" font-size="19" font-weight="700" fill="#16191d">Where the 22 mm extension axis offset sits</text>
<text x="26" y="58" font-size="14" fill="#5a6472">Roval Rapide on a Tarmac SL8 &#183; drawn to scale, 2.6 px per mm &#183; steerer at 73.5&#176;</text>
<text x="26" y="576" font-size="14" fill="#16191d">Measured <tspan font-weight="700">along the steerer</tspan>, from the bottom face of the stem up to the centreline of the extension.</text>
<text x="26" y="598" font-size="14" fill="#16191d">It is 22 of the stem&#8217;s 40 mm clamp height, so the extension sits just above the middle of the clamp.</text>
<text x="26" y="622" font-size="13" fill="#b3261e">Inferred from the fit sheet, not measured. It adds to the headset stack, so 1 mm here = 1 mm of spacers.</text>
