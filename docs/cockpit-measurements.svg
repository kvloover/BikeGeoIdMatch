<line x1="216.4" y1="407.7" x2="604.7" y2="292.7" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="604.7" y="292.7" dy="34" font-size="13" fill="#b3261e" text-anchor="end">mounting face &#8212; what sits on the spacers</text>
<line x1="592.7" y1="296.3" x2="568.7" y2="215.2" stroke="#b3261e" stroke-width="2" marker-start="url(#as)" marker-end="url(#a)"/>
<circle cx="568.7" cy="215.2" r="4" fill="#b3261e"/>
<text x="568.7" y="215.2" dy="-14" font-size="15" font-weight="700" fill="#b3261e" text-anchor="middle">A</text>
<line x1="568.7" y1="215.2" x2="742.7" y2="167.2" stroke="#8b95a2" stroke-width="0.9"/>
<text x="754.7" y="167.2" dy="4" font-size="13" fill="#5a6472">thin aero blade here &#8212;</text>
<text x="754.7" y="167.2" dy="20" font-size="13" fill="#5a6472">its thickness is not what you need</text>
<line x1="152.9" y1="531.3" x2="124.4" y2="435" stroke="#5a6472" stroke-width="1.6" marker-start="url(#gs)" marker-end="url(#g)"/>
