<line x1="262.4" y1="394.1" x2="101.3" y2="441.8" stroke="#8b95a2" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="109.9" y="491.7" font-size="15" font-weight="700" fill="#5a6472" text-anchor="end">C</text>
<text x="446.3" y="444.4" dy="20" dx="8" font-size="13" fill="#5a6472">top of the head tube</text>
<text x="26" y="36" font-size="19" font-weight="700" fill="#16191d">Two measurements that pin down the cockpit</text>
<text x="26" y="58" font-size="14" fill="#5a6472">Roval Rapide 90 mm on a Tarmac SL8 &#183; drawn to scale, 3 px per mm</text>
<g font-size="14" fill="#16191d">
<text x="26" y="512"><tspan font-weight="700" fill="#b3261e">A</tspan>  Sit the cockpit on a flat table, mounting face down. Measure the height from the table</text>
<text x="48" y="532">to the top surface, on the centreline 90 mm forward of the steerer.  <tspan font-weight="700">Predicted 28.2 mm.</tspan></text>
<text x="26" y="558"><tspan font-weight="700" fill="#5a6472">C</tspan>  On the built bike: head tube top to the mounting face, along the steerer.  <tspan font-weight="700">Predicted 33.5 mm.</tspan></text>
</g>
<text x="26" y="588" font-size="13" fill="#b3261e">Measured minus predicted is your spacer correction, near enough 1 mm for 1 mm.</text>
<text x="26" y="612" font-size="13" fill="#5a6472">Don&#8217;t measure the section thickness: at the centre it is a thin blade, and the quoted &#8220;90 mm&#8221; is a conventional-stem equivalent measured</text>
<text x="26" y="628" font-size="13" fill="#5a6472">to where a round bar&#8217;s centre would sit, roughly 16 mm below the top surface. A measures past all of that in one go.</text>
</svg>
