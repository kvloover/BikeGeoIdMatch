changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: New
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Geometry data
      labels: [data, geometry]
    - title: Docs
      labels: [docs, documentation]
    - title: Other changes
      labels: ["*"]
